name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: '4.5.1'
      RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          install -m 755 "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          # Godot 4 использует обычный бинарник с флагом --headless.
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp -a "$RUNNER_TEMP/export-templates/templates/." "$dest/"
          test -f "$dest/android_debug.apk"
          test -f "$dest/android_release.apk"

      - name: Prepare signing and export settings
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          if [ "$RELEASE_BUILD" = "true" ]; then
            test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          python3 ci/configure_export.py

      - name: Import and export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --editor --import
          godot --headless --path . --script ci/verify_humanoid.gd
          godot --headless --path . --script ci/verify_gameplay.gd
          godot --headless --path . --script ci/verify_attack_movement.gd
          if [ "$RELEASE_BUILD" = "true" ]; then
            godot --headless --path . --export-release Android build/game.apk
          else
            godot --headless --path . --export-debug Android build/game.apk
          fi
          test -s build/game.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/game.apk

      - name: Compress assets, align and sign final APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 ci/compress_apk.py build/game.apk build/compressed-unsigned.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f 4 build/compressed-unsigned.apk build/dark-fantasy-mobile.apk
          if [ "$RELEASE_BUILD" = "true" ]; then
            signing_file="$RUNNER_TEMP/release.keystore"
            signing_alias="$KEY_ALIAS"
            export SIGNING_PASSWORD="$KEYSTORE_PASSWORD"
          else
            signing_file="$RUNNER_TEMP/debug.keystore"
            signing_alias="androiddebugkey"
            export SIGNING_PASSWORD="android"
          fi
          "$tools/apksigner" sign --ks "$signing_file" --ks-key-alias "$signing_alias" \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD build/dark-fantasy-mobile.apk
          "$tools/apksigner" verify --verbose build/dark-fantasy-mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-fantasy-android-${{ github.run_number }}
          path: build/dark-fantasy-mobile.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/debug.keystore" export_presets.cfg
